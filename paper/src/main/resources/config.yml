# Econet 설정. 바꾼 뒤에는 서버를 재시작해야 반영된다.

currency:
  # 화면에 보이는 화폐 이름
  name: "듄"
  # 로그·명령어 출력에 쓰는 코드. 장부와 무관하므로 바꿔도 잔액에는 영향이 없다.
  code: "DYN"
  # 화면 표시 형식. {amount}는 천 단위 쉼표가 붙은 금액, {name}은 이름, {code}는 코드
  format: "{amount}{name}"

integrity:
  # 장부 무결성 검사 주기(시간). 서버 시작 시에는 항상 한 번 검사한다.
  check-interval-hours: 24

buyback:
  # 동적 가격: 서버 전체 판매량이 쌓일수록 품목별 가격이 직선으로 내려가 바닥에서 멈추고,
  # 판매가 없으면 바닥에서 기준가까지 recovery-hours에 걸쳐 직선으로 회복한다.
  dynamic:
    # 한 개 팔릴 때마다 기준가에서 깎이는 비율. 임시값: 0.002면 400개가 팔리면 바닥 가격이 된다.
    drop-per-item: 0.002
    # 바닥 가격 = 기준가 × 이 값
    floor-ratio: 0.2
    # 바닥에서 기준가까지 회복하는 시간
    recovery-hours: 24
  # 정부 매입 기준가(듄). 키는 아이템 ID. 여기 없는 아이템은 매입하지 않는다.
  # 제외 품목(에메랄드, 주괴·조각·블록, 사탕수수 등 자동 농장 산출물, 금화)은 일부러 넣지 않았다.
  # 이름을 붙이거나 인챈트하는 등 손댄 아이템도 매입하지 않고 돌려준다.
  prices:
    # 광물: 원석은 광석 채굴로만 나오므로 직접 캤다는 증거가 된다.
    minecraft:coal: 0.5
    minecraft:raw_copper: 0.5
    minecraft:lapis_lazuli: 0.5
    minecraft:quartz: 0.5
    minecraft:redstone: 0.3
    minecraft:raw_iron: 2
    minecraft:raw_gold: 5
    minecraft:diamond: 10
    minecraft:ancient_debris: 30
    # 몹 드롭과 작물: 서버 오픈 후 약 일주일간 장부를 보고 조정한다.
    minecraft:bone: 0.2
    minecraft:string: 0.2
    minecraft:gunpowder: 0.2
    minecraft:rotten_flesh: 0.2
    minecraft:ender_pearl: 1
    minecraft:blaze_rod: 1.5
    minecraft:wheat: 0.1
    minecraft:potato: 0.1
    minecraft:carrot: 0.1
    minecraft:beetroot: 0.1
