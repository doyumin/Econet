# Econet 설정. 바꾼 뒤에는 서버를 재시작해야 반영된다.

currency:
  # 화면에 보이는 화폐 이름
  name: "듄"
  # 로그·명령어 출력에 쓰는 코드. 장부와 무관하므로 바꿔도 잔액에는 영향이 없다.
  code: "DYN"
  # 화면 표시 형식. {amount}는 천 단위 쉼표가 붙은 금액, {name}은 이름, {code}는 코드
  format: "{amount}{name}"

integrity:
  # 장부 무결성 검사 주기(시간). 서버 시작 시에는 항상 한 번 검사한다.
  check-interval-hours: 24

backup:
  # 플레이어 데이터와 econet.db를 같은 시점으로 함께 백업하는 주기(시간). /econet backup 으로 즉시 실행할 수도 있다.
  interval-hours: 6
  # 남길 백업 개수. 오래된 것부터 지운다. 6시간 × 28 = 일주일.
  keep: 28

buyback:
  # 동적 가격: 서버 전체 판매량이 쌓일수록 품목별 가격이 직선으로 내려가 바닥에서 멈추고,
  # 판매가 없으면 바닥에서 기준가까지 recovery-hours에 걸쳐 직선으로 회복한다.
  dynamic:
    # 한 개 팔릴 때마다 기준가에서 깎이는 비율. 임시값: 0.002면 400개가 팔리면 바닥 가격이 된다.
    drop-per-item: 0.002
    # 바닥 가격 = 기준가 × 이 값
    floor-ratio: 0.2
    # 바닥에서 기준가까지 회복하는 시간
    recovery-hours: 24
  # 정부 매입 기준가(듄). 키는 아이템 ID. 여기 없는 아이템은 매입하지 않는다.
  # 제외 품목(에메랄드, 주괴·조각·블록, 사탕수수 등 자동 농장 산출물, 금화)은 일부러 넣지 않았다.
  # 이름을 붙이거나 인챈트하는 등 손댄 아이템도 매입하지 않고 돌려준다.
  prices:
    # 광물: 원석은 광석 채굴로만 나오므로 직접 캤다는 증거가 된다.
    minecraft:coal: 0.5
    minecraft:raw_copper: 0.5
    minecraft:lapis_lazuli: 0.5
    minecraft:quartz: 0.5
    minecraft:redstone: 0.3
    minecraft:raw_iron: 2
    minecraft:raw_gold: 5
    minecraft:diamond: 10
    minecraft:ancient_debris: 30
    # 몹 드롭과 작물: 서버 오픈 후 약 일주일간 장부를 보고 조정한다.
    minecraft:bone: 0.2
    minecraft:string: 0.2
    minecraft:gunpowder: 0.2
    minecraft:rotten_flesh: 0.2
    minecraft:ender_pearl: 1
    minecraft:blaze_rod: 1.5
    minecraft:wheat: 0.1
    minecraft:potato: 0.1
    minecraft:carrot: 0.1
    minecraft:beetroot: 0.1

insurance:
  # 사망 보험료(듄). 가입자가 죽으면 예금에서 정부로 빠지고 인벤토리를 지킨다. 동전은 보험이 있어도 떨군다.
  # 임시값: 서버 운영 후 장부를 보고 정한다.
  premium: 100

bounty:
  # 보스급 몹 현상금(듄). 정부 금고에서 처치한 플레이어에게 지급한다. 일반 몹에는 현상금이 없다.
  # 키는 엔티티 ID. 임시값.
  # 습격 대장은 넣지 않는다: 습격 농장이 흔해서 무한 수입이 된다.
  # 엔더 드래곤은 엔드 수정으로 다시 소환할 수 있어 매번 지급된다. 그래서 한 번에 큰 액수를 주지 않는다.
  rewards:
    minecraft:wither: 500
    minecraft:elder_guardian: 200
    minecraft:ender_dragon: 100

shop:
  # 정부 상점의 시작 품목과 한 개 가격(듄). 임시값: 서버 운영 후 정한다. 최대 54종.
  # plugins/Econet/shop.yml이 없을 때 한 번만 복사된다. 그 뒤로는 /상점관리로 바꾸고, 여기를 고쳐도 반영되지 않는다.
  items:
    minecraft:name_tag: 50
    minecraft:saddle: 80
    minecraft:lead: 20
    minecraft:experience_bottle: 5
    minecraft:clay: 2
    minecraft:sandstone: 1
    minecraft:red_sandstone: 1
    minecraft:brain_coral_block: 5
    minecraft:tube_coral_block: 5
    minecraft:bubble_coral_block: 5
    minecraft:fire_coral_block: 5
    minecraft:horn_coral_block: 5
